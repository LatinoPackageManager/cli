name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun build src/cli.ts --outdir dist --target bun --minify

      - name: Create zip archive
        run: |
          cd dist
          zip -r ../latipm-cli.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: latipm-cli
          path: latipm-cli.zip
          retention-days: 30
