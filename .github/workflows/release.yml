name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun build src/cli.ts --outdir dist --target bun --minify

      - name: Create zip archive
        run: |
          cd dist
          zip -r ../latipm-cli.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: latipm-cli.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
